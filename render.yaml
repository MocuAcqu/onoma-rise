services:
  - type: web
    runtime: node
    name: onoma-rise-api
    rootDir: server
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RECOGNITION_API_URL
        sync: false
      - key: RECOGNITION_PROXY_TOKEN
        sync: false

  - type: web
    runtime: static
    name: onoma-rise
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
